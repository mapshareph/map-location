<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Location Share</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3yn5fKGjMZ0Z0lFz0Gv1pDPdL4Z3A="
    crossorigin=""
  />

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100%; width: 100%; }

    .panel {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      background: rgba(255,255,255,.96);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.20);
    }

    h2 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; line-height: 1.4; color: #444; font-size: 14px; }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 12px; font-size: 13px; color: #333; }
    .privacy { margin-top: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h2>Share your current location</h2>
    <p>
      Your browser will ask for location permission. If you allow it,
      your coordinates, accuracy and submission time will be saved to this site's private location log.
    </p>

    <button id="shareBtn">Share My Location</button>
    <div id="status"></div>
    <div class="privacy">Location is submitted only after you press the button and approve browser permission.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ====== REPLACE THESE TWO VALUES ======
    const SUPABASE_URL = "https://ctybxvpdbvqazrpqhpwn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8mbbQTSYZ3SL29t4a6OckA_13cgSXsC";
    // ======================================

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map("map").setView([14.5995, 120.9842], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const btn = document.getElementById("shareBtn");
    const status = document.getElementById("status");

    btn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        status.textContent = "This browser does not support location sharing.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Waiting for browser permission...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          map.setView([latitude, longitude], 16);

          L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup("Location shared from this device")
            .openPopup();

          status.textContent = "Location found. Saving...";

          const { error } = await supabaseClient
            .from("location_submissions")
            .insert({
              latitude,
              longitude,
              accuracy_m: accuracy,
              user_agent: navigator.userAgent
            });

          if (error) {
  console.error("Supabase error:", error);

  status.innerHTML =
    "<b>Database error:</b><br>" +
    error.message +
    "<br><br><small>Code: " +
    (error.code || "none") +
    "</small>";

  btn.disabled = false;
  return;
          }

          status.innerHTML =
            `Location shared successfully.<br>` +
            `Accuracy: approximately ${Math.round(accuracy)} meters.`;

          btn.textContent = "Location Shared";
        },
        (error) => {
          if (error.code === error.PERMISSION_DENIED) {
            status.textContent = "Location permission was not granted.";
          } else {
            status.textContent = "Unable to retrieve your current location.";
          }
          btn.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
