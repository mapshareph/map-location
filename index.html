<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Location Map">
<meta property="og:description" content="Open the map to view and share a location.">
<meta property="og:type" content="website">

<meta property="og:image" content="https://mapshareph.github.io/map-location/map-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:url" content="https://mapshareph.github.io/map-location/">
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h2>Share your current location</h2>
    <p>
      Your browser will ask for location permission. If you allow it,
      your coordinates, accuracy and submission time will be saved to this site's private location log.
    </p>
    <button id="shareBtn">Share My Location</button>
    <div id="status"></div>
    <div class="privacy">
      Location is submitted only after you press the button and approve browser permission.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ctybxvpdbvqazrpqhpwn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8mbbQTSYZ3SL29t4a6OckA_13cgSXsC";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map("map").setView([14.5995, 120.9842], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const btn = document.getElementById("shareBtn");
    const status = document.getElementById("status");

    btn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        status.textContent = "This browser does not support location sharing.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Waiting for browser location permission...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          map.setView([latitude, longitude], 16);
          L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup("Location shared from this device")
            .openPopup();

          status.textContent = "Location found. Saving to the location log...";

          try {
            const { error } = await supabaseClient
              .from("location_submissions")
              .insert({
                latitude: latitude,
                longitude: longitude,
                accuracy_m: accuracy,
                user_agent: navigator.userAgent
              });

            if (error) {
              console.error("Supabase error:", error);
              status.innerHTML =
                "<b>Database error:</b><br>" +
                escapeHtml(error.message || "Unknown database error") +
                "<br><small>Code: " +
                escapeHtml(error.code || "none") +
                "</small>";
              btn.disabled = false;
              return;
            }

            status.innerHTML =
              "<b>Location shared successfully.</b><br>" +
              "Accuracy: approximately " + Math.round(accuracy) + " meters.";
            btn.textContent = "Location Shared";
          } catch (err) {
            console.error("Request error:", err);
            status.innerHTML =
              "<b>Connection error:</b><br>" +
              escapeHtml(err && err.message ? err.message : String(err));
            btn.disabled = false;
          }
        },
        (error) => {
          if (error.code === error.PERMISSION_DENIED) {
            status.textContent = "Location permission was not granted.";
          } else if (error.code === error.TIMEOUT) {
            status.textContent = "Location request timed out. Please try again.";
          } else {
            status.textContent = "Unable to retrieve your current location.";
          }
          btn.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
